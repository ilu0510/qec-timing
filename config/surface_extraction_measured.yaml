limits:
  note: 'X faults only (Z-basis readout); b_read_floor is an upper bound, since a
    data fault landing after its CNOT reaches the readout without reaching the ancilla;
    p_stab is proportional to p_1q and so is provenance only -- only lambda and b_read_floor
    are scale-free. The X-ancilla loses 2 h gates (4 charged ops) relative to a real
    round; this touches neither the data side nor the Z-ancillas, which are what the
    exported ratios use. p_2q is zero throughout, so correlated data<->ancilla faults
    are absent. Per-qubit marginals only: which qubits fail together is not recorded.'
